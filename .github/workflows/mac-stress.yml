name: Mac stress (33079 measurement, branch-only)
on:
  push:
    branches: ['33079/macstress*']
jobs:
  mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Pin bash to the stock /bin/bash
        run: |
          mkdir -p "$HOME/stockbash"
          ln -sf /bin/bash "$HOME/stockbash/bash"
          ln -sf /bin/sh   "$HOME/stockbash/sh"
          echo "$HOME/stockbash" >> "$GITHUB_PATH"
      - name: Test 62 alone, traced; on a kill show where it died and what the system says
        shell: /bin/bash {0}
        run: |
          cd mmry/tests; chmod +x libs/bats-core/bin/bats
          ./libs/bats-core/bin/bats --trace --filter "no customer surface promises" structural/codex-docs-and-eol.bats > /tmp/o 2> /tmp/e; rc=$?
          echo "rc=$rc"
          if grep -q "Killed: 9" /tmp/e /tmp/o; then
            echo "=== KILLED: last 60 trace lines"; tail -60 /tmp/e | cut -c1-240
            echo "=== trace lines total: $(wc -l < /tmp/e)"
            echo "=== kernel log"; sudo log show --last 10m --info --predicate 'eventMessage CONTAINS[c] "kill" OR eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "memorystatus"' 2>&1 | grep -v "^Filtering\|^Timestamp" | tail -40 | cut -c1-300
            echo "=== memory"; vm_stat | head -6; memory_pressure 2>&1 | tail -5
            echo "=== ps"; ps -Ao pid,ppid,pcpu,pmem,rss,command | sort -k4 -nr | head -8 | cut -c1-160
          else
            echo "not killed on this machine"; tail -3 /tmp/o
          fi
