name: Stress (33079 measurement, branch-only)
on:
  push:
    branches: ['33079/stress*']
jobs:
  stress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Stress the three flaking tests under CPU load
        shell: /bin/bash {0}
        env:
          ITER: ${{ vars.ITER || 40 }}
        run: |
          cd mmry/tests
          chmod +x libs/bats-core/bin/bats
          source helpers/isolate-home.bash; mmry_isolate_home
          for i in $(seq 1 6); do ( while :; do :; done ) & done
          run_target() {  # name file filter
            local fails=0 n
            for n in $(seq 1 "${ITER:-40}"); do
              if ! out="$(./libs/bats-core/bin/bats --filter "$3" "$2" 2>&1)"; then
                fails=$((fails+1)); echo "---- FAIL $1 iteration $n"; echo "$out" | grep -vE "^ok |^1\.\." | cut -c1-300 | head -12
              fi
            done
            echo "RESULT $1: $fails failures in ${ITER:-40} runs"
          }
          run_target R4        handlers/foundation-in-time.bats        "in-time R4: a prepared copy that no longer matches"
          run_target TC5       handlers/foundation-31597-edges.bats    "TC5: the by-reference copy holds the NUL"
          run_target wfc       unit/foundation-cache-write.bats        "what this writes is accepted by the reader"
          echo "== cksum log (R4 shim)"; cat /tmp/mmry-measure/cksum.log 2>/dev/null | wc -l
