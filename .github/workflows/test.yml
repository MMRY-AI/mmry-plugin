name: Plugin Tests

# `develop` is on both lists deliberately (#31385). The macOS leg of this matrix has existed since
# the workflow was written, but the triggers only ever named the release branches, so no branch
# targeting `develop` had ever run on a Mac. A macOS-specific defect therefore shipped with "there
# is no Mac here" written into its own tests while a Mac runner sat unused in this file.
on:
  push:
    branches: [main, master, develop, '31406/**']
  pull_request:
    branches: [main, master, develop, '31406/**']

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rep: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # A macOS runner is not by itself a test of the shell macOS ships. The image also carries a
      # Homebrew bash 5 that wins on PATH, so `#!/usr/bin/env bash` in bats and in every handler
      # would silently pick the NEW shell and the run would prove nothing about the 3.2 a customer
      # actually has at /bin/bash. This puts a `bash` that IS /bin/bash at the front of PATH, so the
      # whole suite - bats, handlers, fixtures - runs on the stock shell.
      - name: Pin bash to the stock /bin/bash (macOS only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/stockbash"
          ln -sf /bin/bash "$HOME/stockbash/bash"
          ln -sf /bin/sh   "$HOME/stockbash/sh"
          echo "$HOME/stockbash" >> "$GITHUB_PATH"

      - name: Report the shell under test
        shell: bash
        run: |
          echo "runner.os      = ${{ runner.os }}"
          echo "which bash     = $(command -v bash)"
          echo "bash --version = $(bash --version | head -1)"
          echo "/bin/bash      = $(/bin/bash --version | head -1)"
          echo "BASH_VERSION   = ${BASH_VERSION}"
          echo "timeout        = $(command -v timeout || echo ABSENT)"
          echo "gtimeout       = $(command -v gtimeout || echo ABSENT)"

      # #32272 (DD-140 in the mmry repository): customer-readable text must not name an internal
      # memory mechanic. Its own step, ahead of the suite, so a refusal is named in the job summary
      # rather than buried among the BATS results. The suite runs it again in
      # structural/public-text-check.bats.
      - name: Check customer-readable text for internal memory mechanics
        shell: /bin/bash -e {0}
        run: bash scripts/check-public-text.sh

      # #32457 (DD-150 in the mmry repository): the AI database is called a database and its
      # items entries wherever customers and assistants read the plugin, and since #32957 (DD-164)
      # in every name too. The suite runs it again in structural/database-names-check.bats.
      - name: Check customer-readable text for the AI database names
        shell: /bin/bash -e {0}
        run: bash scripts/check-database-names.sh

      # #32957 fix round 3: round 1's substring rename damaged a Formation name
      # (mmry_create_formation became mmry_create_database-ion) and no check noticed. Every Formation
      # name on develop must still exist, and no rename may join a letter onto database or entry.
      # The checkout is shallow, so develop is fetched first as the base to compare with.
      - name: Check a rename kept every Formation name and damaged no word
        shell: /bin/bash -e {0}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/develop:refs/remotes/origin/develop
          bash scripts/check-rename-damage.sh --base origin/develop

      # #32957 fix round 4: self-update removes from customer machines every plugin file that
      # mmry/release-files.txt does not name, so the list must match the tree exactly. Its own
      # step so a stale list is named in the job summary. The suite runs it again in
      # structural/release-files.bats.
      - name: Check the release file list matches the tree
        shell: /bin/bash -e {0}
        run: bash scripts/build-release-files.sh --check

      - name: Run offline tests (structural + unit + handlers)
        # /bin/bash explicitly, so the step's own shell is the stock one on macOS too.
        shell: /bin/bash -e {0}
        run: |
          cd mmry/tests
          chmod +x run-tests.sh
          chmod +x libs/bats-core/bin/bats
          ./run-tests.sh offline

  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: offline-tests
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run integration tests
        env:
          MMRY_INTEGRATION_API_KEY: ${{ secrets.MMRY_INTEGRATION_API_KEY }}
        run: |
          cd mmry/tests
          chmod +x run-tests.sh
          chmod +x libs/bats-core/bin/bats
          ./run-tests.sh integration
